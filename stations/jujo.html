<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>十条駅｜腹痛持ちのための駅トイレマップ</title>
<link rel="icon" type="image/png" sizes="48x48" href="../favicon-48x48.png" />
<link rel="shortcut icon" href="../favicon-48x48.png" />
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="512x512" href="../favicon-512x512.png" />
    <meta name="description" content="十条駅のトイレ情報ページ。場所・きれい度・大の空きの可能性/小の空きの可能性・新しさを掲載。腹痛持ちのための駅トイレマップ。" />
<link rel="stylesheet" href="../stomach_pain.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🚻</span>
        <div class="brand-text">
          <div class="brand-name">腹痛持ちのための駅トイレマップ</div>
        </div>
      </div>
      <nav class="nav">
        <a class="btn ghost" href="../index.html">一覧へ戻る</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-head station-title">
        <h2>十条駅</h2>
        <p class="muted">十条駅トイレの詳細ページ。情報に間違い等があったら是非報告お願いします。</p>
      </div>
      <div class="card" data-ticket-gate="inside">
        <div class="card-body">
          <h3>構内(改札内)</h3>
          <dl class="kv">
            <div>
              <dt>場所</dt>
              <dd>構内(改札内)</dd>
            </div>
            <div>
              <dt>トイレの<br>きれい度</dt>
              <dd>★★★☆☆</dd>
            </div>
            <div>
              <dt>大期待値</dt>
              <dd>★★★☆☆</dd>
            </div>
            <div>
              <dt>小期待値</dt>
              <dd>★★★☆☆</dd>
            </div>
            <div>
              <dt>トイレの<br>新しさ</dt>
              <dd>普通</dd>
            </div>
          </dl>
        </div>
      </div>
      <div class="card" data-ticket-gate="outside">
        <div class="card-body">
          <h3>代案(駅外・十条銀座)</h3>
          <dl class="kv">
            <div>
              <dt>場所</dt>
              <dd>代案(駅外・十条銀座)</dd>
            </div>
            <div>
              <dt>トイレの<br>きれい度</dt>
              <dd>★★★☆☆</dd>
            </div>
            <div>
              <dt>大期待値</dt>
              <dd>★★★☆☆</dd>
            </div>
            <div>
              <dt>小期待値</dt>
              <dd>★★★☆☆</dd>
            </div>
            <div>
              <dt>トイレの<br>新しさ</dt>
              <dd>普通</dd>
            </div>
          </dl>
        </div>
      </div>
    </div>
  </main>
<script>
  (() => {
    const BASE_URL = "https://haraitamap.com";
    const getStationName = () => {
      const fromHeading = document.querySelector(".station-title h2")?.textContent?.trim();
      if (fromHeading) return fromHeading;
      const fromTitle = document.title.split("｜")[0]?.trim();
      return fromTitle || "TODO: 駅名";
    };

    const normalizeLabel = (text) => (text || "").replace(/\s+/g, "");

    const getMetric = (card, label) => {
      const rows = Array.from(card.querySelectorAll(".kv div"));
      for (const row of rows) {
        const dt = normalizeLabel(row.querySelector("dt")?.textContent);
        if (dt === label) {
          return row.querySelector("dd")?.textContent?.trim() || "";
        }
      }
      return "";
    };

    const getTicketGateValue = (card) => {
      const raw = card.dataset.ticketGate || "unknown";
      if (raw === "inside" || raw === "outside") {
        return raw;
      }
      return "unknown";
    };

    const getTicketGateLabel = (card) => {
      const gate = getTicketGateValue(card);
      if (gate === "inside") return "改札内";
      if (gate === "outside") return "改札外";
      return "TODO: 未記載";
    };

    const stationName = getStationName();
    const pagePath = location.pathname.includes("/stations/")
      ? location.pathname.slice(location.pathname.indexOf("/stations/"))
      : "/stations/" + (location.pathname.split("/").pop() || "TODO.html");
    const pageUrl = BASE_URL + pagePath;
    const container = document.querySelector("main .container");
    const stationCardsOnPage = Array.from(document.querySelectorAll(".container > .card"));
    const photoCredit = Array.from(container?.children || []).find((el) =>
      el.tagName === "P" && el.classList.contains("muted") && el.style.marginTop === "12px"
    );

    const gateFilterItems = [
      { value: "all", label: "全部" },
      { value: "inside", label: "改札内" },
      { value: "outside", label: "改札外" }
    ];
    let gateFilterValue = "all";

    const ensureGateFilterControls = () => {
      if (!container || stationCardsOnPage.length === 0) {
        return null;
      }

      let controls = container.querySelector(":scope > .sort-controls");
      if (!controls) {
        controls = document.createElement("div");
        controls.className = "sort-controls";
        controls.style.margin = "12px 0 16px";
        const firstCard = stationCardsOnPage[0] || photoCredit || null;
        container.insertBefore(controls, firstCard);
      }

      controls.style.display = "flex";
      controls.style.flexWrap = "wrap";
      controls.style.alignItems = "center";
      controls.style.gap = "8px";

      let filterWrap = controls.querySelector(".ticket-gate-filter-wrap");
      if (!filterWrap) {
        filterWrap = document.createElement("div");
        filterWrap.className = "ticket-gate-filter-wrap";
        filterWrap.style.position = "relative";
        filterWrap.style.display = "inline-flex";
        filterWrap.style.marginLeft = controls.querySelector("select") ? "12px" : "0";
        controls.appendChild(filterWrap);
      }

      let filterButton = filterWrap.querySelector("#ticket-gate-filter-button");
      if (!filterButton) {
        filterButton = document.createElement("button");
        filterButton.type = "button";
        filterButton.id = "ticket-gate-filter-button";
        filterButton.className = "btn small ghost";
        filterButton.textContent = "フィルター▼";
        filterButton.setAttribute("aria-haspopup", "true");
        filterButton.setAttribute("aria-expanded", "false");
        filterWrap.appendChild(filterButton);
      }

      let filterMenu = filterWrap.querySelector("#ticket-gate-filter-menu");
      if (!filterMenu) {
        filterMenu = document.createElement("div");
        filterMenu.id = "ticket-gate-filter-menu";
        filterMenu.setAttribute("role", "menu");
        filterMenu.hidden = true;
        filterMenu.style.position = "absolute";
        filterMenu.style.top = "calc(100% + 8px)";
        filterMenu.style.left = "0";
        filterMenu.style.minWidth = "140px";
        filterMenu.style.padding = "6px";
        filterMenu.style.borderRadius = "14px";
        filterMenu.style.border = "1px solid rgba(17, 24, 39, 0.08)";
        filterMenu.style.background = "rgba(255, 255, 255, 0.98)";
        filterMenu.style.boxShadow = "0 12px 30px rgba(15, 23, 42, 0.14)";
        filterMenu.style.backdropFilter = "blur(10px)";
        filterMenu.style.zIndex = "20";

        gateFilterItems.forEach((item) => {
          const itemButton = document.createElement("button");
          itemButton.type = "button";
          itemButton.textContent = item.label;
          itemButton.dataset.value = item.value;
          itemButton.setAttribute("role", "menuitemradio");
          itemButton.style.display = "block";
          itemButton.style.width = "100%";
          itemButton.style.border = "0";
          itemButton.style.borderRadius = "10px";
          itemButton.style.padding = "10px 12px";
          itemButton.style.textAlign = "left";
          itemButton.style.background = "transparent";
          itemButton.style.cursor = "pointer";
          itemButton.style.color = "#0f172a";
          itemButton.addEventListener("click", () => {
            gateFilterValue = item.value;
            syncGateFilterMenu();
            applyGateFilter();
            filterMenu.hidden = true;
            filterButton.setAttribute("aria-expanded", "false");
          });
          filterMenu.appendChild(itemButton);
        });

        filterWrap.appendChild(filterMenu);
      }

      return { controls, filterWrap, filterButton, filterMenu };
    };

    const gateFilterUi = ensureGateFilterControls();

    const syncGateFilterMenu = () => {
      if (!gateFilterUi) {
        return;
      }
      const menuButtons = Array.from(gateFilterUi.filterMenu.querySelectorAll("button[data-value]"));
      menuButtons.forEach((button) => {
        const isActive = button.dataset.value === gateFilterValue;
        button.setAttribute("aria-checked", isActive ? "true" : "false");
        button.style.fontWeight = isActive ? "700" : "500";
        button.style.background = isActive ? "#0f172a" : "transparent";
        button.style.color = isActive ? "#ffffff" : "#0f172a";
      });
    };

    const applyGateFilter = () => {
      let visibleCount = 0;
      stationCardsOnPage.forEach((card) => {
        const gate = card.dataset.ticketGate || "unknown";
        const shouldShow = gateFilterValue === "all" || gate === gateFilterValue;
        card.hidden = !shouldShow;
        if (shouldShow) {
          visibleCount += 1;
        }
      });
      if (photoCredit) {
        photoCredit.hidden = visibleCount === 0;
      }
    };

    if (gateFilterUi) {
      gateFilterUi.filterButton.addEventListener("click", () => {
        const willOpen = gateFilterUi.filterMenu.hidden;
        gateFilterUi.filterMenu.hidden = !willOpen;
        gateFilterUi.filterButton.setAttribute("aria-expanded", willOpen ? "true" : "false");
        if (willOpen) {
          syncGateFilterMenu();
        }
      });

      document.addEventListener("click", (event) => {
        if (!gateFilterUi.filterWrap.contains(event.target)) {
          gateFilterUi.filterMenu.hidden = true;
          gateFilterUi.filterButton.setAttribute("aria-expanded", "false");
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          gateFilterUi.filterMenu.hidden = true;
          gateFilterUi.filterButton.setAttribute("aria-expanded", "false");
        }
      });
    }

    syncGateFilterMenu();
    applyGateFilter();

    const breadcrumb = {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "トップページ",
          "item": BASE_URL + "/index.html"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "駅一覧",
          "item": BASE_URL + "/index.html#stations"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": stationName,
          "item": pageUrl
        }
      ]
    };

    const toilets = stationCardsOnPage.map((card, index) => {
      const title = card.querySelector("h3")?.textContent?.trim() || `トイレ ${index + 1}`;
      const locationText = getMetric(card, "場所") || "TODO: 場所未記載";
      const routeText = getMetric(card, "行き方");
      const clean = getMetric(card, "トイレのきれい度") || "TODO: 未記載";
      const big = getMetric(card, "大期待値") || "TODO: 未記載";
      const small = getMetric(card, "小期待値") || "TODO: 未記載";
      const newness = getMetric(card, "トイレの新しさ") || "TODO: 未記載";
      const ticketGate = getTicketGateLabel(card);

      return {
        "@type": "PublicToilet",
        "@id": `${pageUrl}#public-toilet-${index + 1}`,
        "name": `${stationName} ${title}`,
        "description": [locationText, routeText].filter(Boolean).join(" / "),
        "url": pageUrl,
        "isPartOf": {
          "@type": "Place",
          "name": stationName
        },
        "additionalProperty": [
          { "@type": "PropertyValue", "name": "改札内外", "value": ticketGate },
          { "@type": "PropertyValue", "name": "きれい度", "value": clean },
          { "@type": "PropertyValue", "name": "大期待値", "value": big },
          { "@type": "PropertyValue", "name": "小期待値", "value": small },
          { "@type": "PropertyValue", "name": "新しさ", "value": newness }
        ]
      };
    });

    const jsonLd = {
      "@context": "https://schema.org",
      "@graph": [breadcrumb, ...toilets]
    };

    const script = document.createElement("script");
    script.type = "application/ld+json";
    script.text = JSON.stringify(jsonLd, null, 2);
    document.head.appendChild(script);

    // TODO: Dataset はデータ公開ページが作成された場合に追加
    // TODO: LocalBusiness は実在施設・提携施設ページが作成された場合に追加
  })();
</script>
<script>
(() => {
  const stationPath = window.location.pathname;
  const stationName =
    document.querySelector(".station-title h2")?.textContent.trim();

  if (!stationName) {
    return;
  }

  const sessionKey = `station-viewed:${stationPath}`;

  if (sessionStorage.getItem(sessionKey)) {
    return;
  }

  sessionStorage.setItem(sessionKey, "1");

  fetch("/api/station-view", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      stationPath,
      stationName
    }),
    keepalive: true
  }).catch((error) => {
    console.warn("閲覧数の記録に失敗しました。", error);
    sessionStorage.removeItem(sessionKey);
  });
})();
</script>
<script src="../station-view-client.js"></script>
</body>
</html>
