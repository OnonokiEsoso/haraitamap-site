                  "route": "確実な一般トイレ位置を示せないため、現地案内・駅員への確認を優先してください。",
                  "equipment": "バリアフリートイレなしは公式情報で確認。一般トイレ設備は現在確認中です。<br><strong>バリアフリートイレなしは一次情報／一般トイレは現在確認中</strong>",
                  "caution": "『トイレあり』と推測で表示しません。一般トイレの存在自体が要確認です。",
                  "sources": "JR東日本公式（バリアフリー設備情報）",
              },
              "ukimafunado": {
                  "name": "浮間舟渡駅",
                  "quick": "1階改札階へ移動し、エスカレーター横という旧位置情報を目安に現地表示を確認してください。",
                  "place": "1階改札階。旧具体情報ではエスカレーター横です。",
                  "route": "ホームから1階改札階へ移動し、トイレ表示を確認してください。エスカレーター横という具体位置は旧情報です。",
                  "equipment": "鉄道会社公式のバリアフリー設備情報を優先。現在の個室数は不明です。<br><strong>改札階は調査レポート／エスカレーター横・混雑は旧情報</strong>",
                  "caution": "朝に混みやすい・昼は空きやすいという傾向は旧情報です。2026年現在の混雑として断定しません。",
                  "sources": "JR東日本公式（駅構内図・バリアフリー情報）／補助：過去のトイレ調査資料",
              },
              "yonohonmachi": {
                  "name": "与野本町駅",
                  "quick": "1階改札階へ移動し、改札に向かって右側を確認してください。",
                  "place": "1階改札階、改札に向かって右側です。",
                  "route": "ホームから1階改札階へ移動し、改札方向へ進んで右側のトイレ表示を確認してください。",
                  "equipment": "鉄道会社公式のバリアフリー設備情報を優先。現在の個室数は不明です。<br><strong>位置は調査レポート／混雑は旧情報</strong>",
                  "caution": "比較的混みにくいという記録は旧情報です。2026年現在の混雑としては断定しません。",
                  "sources": "JR東日本公式（駅構内図・バリアフリー情報）／補助：過去のトイレ調査資料",
              },
          }

          for stem, d in DATA.items():
              path = f"stations/{stem}.html"
              raw = subprocess.check_output(["git", "show", f"origin/main:{path}"])
              text = raw.decode("utf-8")
              marker = '<section class="station-report" id="station-report">'
              idx = text.find(marker)
              if idx < 0:
                  raise RuntimeError(f"station-report marker not found: {path}")
              line_start = text.rfind("\n", 0, idx) + 1
              indent = text[line_start:idx]
              i1 = indent + "  "
              i2 = indent + "    "
              section = "\n".join([
                  f'{indent}<section class="station-research-details" id="research-details" aria-label="{d["name"]}の腹痛時実用情報">',
                  f'{i1}<div class="card"><div class="card-body"><h3>腹痛時の実用情報</h3><dl class="kv">',
                  f'{i2}<div><dt>急いでいる場合</dt><dd>{d["quick"]}</dd></div>',
                  f'{i2}<div><dt>具体的な場所</dt><dd>{d["place"]}</dd></div>',
                  f'{i2}<div><dt>行き方</dt><dd>{d["route"]}</dd></div>',
                  f'{i2}<div><dt>設備・情報確度</dt><dd>{d["equipment"]}</dd></div>',
                  f'{i2}<div><dt>注意点</dt><dd>{d["caution"]}</dd></div>',
                  f'{i2}<div><dt>情報確認日</dt><dd>2026年9月16日</dd></div>',
                  f'{i2}<div><dt>主な情報源</dt><dd>{d["sources"]}</dd></div>',
                  f'{i1}</dl></div></div>',
                  f'{indent}</section>',
              ]) + "\n"
              text = text[:line_start] + section + text[line_start:]
              Path(path).write_bytes(text.encode("utf-8"))

      - name: Verify preservation
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          stems = [
              "ayase","higashitotsuka","hodogaya","itabashi","jujo","kamakura",
              "kitaakabane","kitakamakura","kitamiya","kitatoda","kitayono","minamiyono",
              "musashiurawa","nakaurawa","nanasato","nishioi","omiyakoen","owada",
              "shinkawasaki","toda","todakoen","torisawa","ukimafunado","yonohonmachi"
          ]
          required = [
              '../station-sort-client.js', '../action-usage-client.js', '../station-view-client.js',
              'const gateFilterItems = [', 'const jsonLd = {', 'application/ld+json',
              'id="station-report"'
          ]
          for stem in stems:
              path = Path(f"stations/{stem}.html")
              text = path.read_text(encoding="utf-8")
              for needle in required:
                  if needle not in text:
                      raise RuntimeError(f"{needle!r} missing from {path}")
              if text.count('id="research-details"') != 1:
                  raise RuntimeError(f"research section count invalid: {path}")

