<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="腹痛時に少し気を逸らしたいときのミニゲームページ。短時間で遊べる絵合わせゲームを用意しています。" />
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png" />
<link rel="shortcut icon" href="favicon-48x48.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512x512.png" />
<title>気を逸らす｜腹痛持ちのための駅トイレマップ</title>
<link rel="stylesheet" href="style.css" />
<style>
  .games-page .games-main {
    width: min(1180px, calc(100% - 40px));
    margin: 0 auto;
    padding: 26px 0 72px;
  }

  .games-page .games-hero {
    position: relative;
    overflow: hidden;
    border: 1px solid #858b81;
    border-top: 8px solid #75674e;
    background:
      radial-gradient(
        ellipse at 100% 0,
        transparent 0 78px,
        rgba(99, 122, 91, 0.12) 79px 81px,
        transparent 82px 102px,
        rgba(99, 122, 91, 0.1) 103px 105px,
        transparent 106px
      ),
      rgba(255, 253, 247, 0.84);
    box-shadow: 0 18px 45px rgba(28, 47, 39, 0.09);
  }

  .games-page .games-hero-head {
    display: grid;
    grid-template-columns: 54px 1fr auto;
    min-height: 84px;
    align-items: center;
    gap: 18px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
  }

  .games-page .games-hero-head p,
  .games-page .game-section-head p {
    margin: 0 0 3px;
    color: #748078;
    font-size: 0.61rem;
    font-weight: 900;
    letter-spacing: 0.2em;
  }

  .games-page .games-hero-head h1,
  .games-page .game-section-head h2 {
    margin: 0;
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    font-weight: 700;
    letter-spacing: 0.06em;
  }

  .games-page .games-hero-head h1 {
    font-size: clamp(1.55rem, 3vw, 2rem);
  }

  .games-page .hero-badge {
    border: 1px solid #9aa596;
    color: var(--forest);
    padding: 8px 13px;
    font-size: 0.7rem;
    font-weight: 800;
  }

  .games-page .games-hero-copy {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(240px, 0.62fr);
    min-height: 180px;
  }

  .games-page .games-hero-copy > div {
    padding: 28px 24px;
  }

  .games-page .games-hero-copy > div:first-child {
    border-right: 1px solid var(--line);
  }

  .games-page .games-hero-copy strong {
    display: block;
    color: var(--forest);
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    font-size: clamp(1.2rem, 2.4vw, 1.7rem);
    line-height: 1.5;
  }

  .games-page .games-hero-copy p {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 0.78rem;
    line-height: 1.8;
  }

  .games-page .hero-note {
    display: grid;
    align-content: center;
    background: rgba(97, 123, 94, 0.08);
  }

  .games-page .hero-note span {
    color: var(--moss);
    font-size: 0.65rem;
    font-weight: 900;
    letter-spacing: 0.12em;
  }

  .games-page .hero-note b {
    margin-top: 8px;
    color: var(--forest);
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    font-size: 1rem;
    line-height: 1.55;
  }

  .games-page .game-section {
    padding-top: 42px;
    scroll-margin-top: 92px;
  }

  .games-page .game-section-head {
    display: flex;
    min-height: 85px;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
    border-top: 1px solid #9da39b;
    border-bottom: 1px solid #9da39b;
  }

  .games-page .game-section-head > span {
    color: var(--moss);
    font-family: Georgia, serif;
    font-size: 2.2rem;
  }

  .games-page .game-section-head h2 {
    font-size: clamp(1.7rem, 3vw, 2.35rem);
  }

  .games-page .game-card {
    position: relative;
    overflow: hidden;
    max-width: 700px;
    margin: 0 auto;
    border: 1px solid #989e96;
    border-left: 7px solid var(--moss);
    background:
      linear-gradient(90deg, rgba(97, 123, 94, 0.04), transparent 22%, rgba(97, 123, 94, 0.025)),
      rgba(255, 253, 247, 0.86);
    box-shadow: 0 14px 34px rgba(28, 47, 39, 0.09);
  }

  .games-page .game-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    padding: 18px 20px;
    background: rgba(97, 123, 94, 0.07);
  }

  .games-page .game-card-header p {
    margin: 0 0 3px;
    color: var(--moss);
    font-size: 0.58rem;
    font-weight: 900;
    letter-spacing: 0.16em;
  }

  .games-page .game-card-header h3 {
    margin: 0;
    color: var(--forest);
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    font-size: 1.35rem;
  }

  .games-page .game-card-body {
    padding: 20px;
  }

  .games-page .game-controls {
    display: grid;
    grid-template-columns: minmax(160px, 1fr) auto;
    gap: 12px;
    align-items: end;
  }

  .games-page .form-row {
    display: grid;
    gap: 7px;
  }

  .games-page .form-row label {
    color: #5e6a62;
    font-size: 0.68rem;
    font-weight: 900;
    letter-spacing: 0.12em;
  }

  .games-page .form-row select {
    min-height: 46px;
    width: 100%;
    border: 1px solid #929b91;
    border-bottom: 3px solid var(--moss);
    border-radius: 0;
    background: rgba(248, 245, 236, 0.96);
    color: var(--ink);
    padding: 0 12px;
    font-weight: 800;
  }

  .games-page #memory-reset {
    min-height: 46px;
    border: 1px solid var(--forest);
    border-radius: 0;
    background: var(--forest);
    color: #fff;
    padding: 0 18px;
    cursor: pointer;
    font-size: 0.76rem;
    font-weight: 900;
  }

  .games-page #memory-reset:hover {
    background: var(--forest-dark);
  }

  .games-page .game-stats {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 16px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 10px 0;
  }

  .games-page .game-status {
    margin: 0;
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 800;
  }

  .games-page .game-board {
    display: grid;
    gap: 7px;
    margin-top: 18px;
  }

  .games-page .memory-board {
    grid-template-columns: repeat(4, 1fr);
  }

  .games-page .tile {
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 1px solid #89948a;
    border-radius: 0;
    background:
      linear-gradient(135deg, rgba(97, 123, 94, 0.13), transparent 65%),
      #eef0e6;
    color: var(--forest);
    display: grid;
    place-items: center;
    cursor: pointer;
    font-family: Georgia, "Yu Mincho", serif;
    font-size: clamp(0.86rem, 2.2vw, 1.15rem);
    font-weight: 900;
    user-select: none;
    transition:
      transform 0.12s ease,
      background 0.12s ease,
      border-color 0.12s ease;
  }

  .games-page .tile:hover:not(:disabled) {
    transform: translateY(-1px);
    border-color: var(--forest);
  }

  .games-page .tile.revealed {
    background: rgba(255, 253, 247, 0.96);
    border-color: var(--moss);
  }

  .games-page .tile.matched {
    background: rgba(97, 123, 94, 0.2);
    border-color: var(--forest);
  }

  .games-page .confetti-layer {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    overflow: hidden;
  }

  .games-page .confetti-piece {
    position: absolute;
    top: -10px;
    opacity: 0;
    animation: gamesConfettiFall 1000ms ease-out forwards;
  }

  .games-page .return-note {
    display: grid;
    grid-template-columns: 170px 1fr auto;
    align-items: center;
    gap: 18px;
    max-width: 700px;
    margin: 20px auto 0;
    border: 1px solid #9da39b;
    color: var(--muted);
    font-size: 0.7rem;
    line-height: 1.7;
  }

  .games-page .return-note strong {
    display: grid;
    min-height: 100%;
    place-items: center;
    background: #6e766d;
    color: #fff;
    padding: 11px;
  }

  .games-page .return-note span {
    padding: 11px 0;
  }

  .games-page .return-note a {
    margin-right: 11px;
    border: 1px solid var(--forest);
    color: var(--forest);
    padding: 8px 11px;
    font-weight: 900;
  }

  @keyframes gamesConfettiFall {
    0% {
      opacity: 1;
      transform: translate3d(calc(var(--dx, 0px) * 0.2), -10px, 0) rotate(0deg) scale(1.05);
    }
    100% {
      opacity: 0;
      transform: translate3d(calc(var(--dx, 0px) * 2.1), var(--dy, 240px), 0) rotate(var(--rot, 540deg)) scale(0.9);
    }
  }

  @media (max-width: 720px) {
    .games-page .games-main {
      width: min(100% - 24px, 1180px);
      padding-top: 16px;
    }

    .games-page .games-hero-head {
      grid-template-columns: 48px 1fr;
      gap: 12px;
      padding: 12px 14px;
    }

    .games-page .hero-badge {
      grid-column: 1 / -1;
      justify-self: stretch;
      text-align: center;
    }

    .games-page .games-hero-copy {
      grid-template-columns: 1fr;
    }

    .games-page .games-hero-copy > div {
      padding: 20px 15px;
    }

    .games-page .games-hero-copy > div:first-child {
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }

    .games-page .game-controls {
      grid-template-columns: 1fr;
    }

    .games-page .game-stats {
      flex-direction: column;
      gap: 4px;
    }

    .games-page .return-note {
      grid-template-columns: 1fr;
      gap: 0;
    }

    .games-page .return-note strong,
    .games-page .return-note span,
    .games-page .return-note a {
      margin: 0;
      padding: 10px 12px;
    }

    .games-page .return-note a {
      border-right: 0;
      border-bottom: 0;
      border-left: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .games-page .confetti-piece {
      animation: none !important;
    }
  }
</style>

<body class="games-page">
  <div class="site-shell">
    <a class="skip-link" href="#memory-game">ゲームへ移動</a>

    <header class="site-header">
      <div class="header-inner">

          <img
            class="brand-icon"
            src="favicon-512x512.png"
            alt=""
            width="52"
            height="52"
          >
          <span class="brand-copy">
            <small>HARAITA MAP / STATION GUIDE</small>
            <strong>腹痛持ちのための駅トイレマップ</strong>
          </span>
        </a>

        <nav aria-label="主要メニュー">
          <a href="index.html#search-panel"><span>01</span>駅を探す</a>
          <a href="#memory-game"><span>02</span>絵合わせ</a>
          <a class="nav-accent" href="coping.html"><span>03</span>対処法について</a>
        </nav>
      </div>
    </header>

    <main class="games-main">
      <section class="games-hero" aria-labelledby="games-title">
        <header class="games-hero-head">
          <span class="section-number">遊</span>
          <div>
            <p>DISTRACTION / MINI GAME</p>
            <h1 id="games-title">少し気を逸らす</h1>
          </div>
          <span class="hero-badge">短時間で遊べるミニゲーム</span>
        </header>

      </section>

      <section class="game-section" id="memory-game" aria-labelledby="memory-title">
        <header class="game-section-head">
          <span>01</span>
          <div>
            <p>MEMORY GAME</p>
            <h2>絵合わせ</h2>
          </div>
        </header>

        <section class="game-card" aria-labelledby="memory-title">
          <div class="game-card-body">
            <div class="game-controls">
              <div class="form-row">
                <label for="memory-size">盤面サイズ</label>
                <select id="memory-size" name="memory-size">
                  <option value="4x4">4 × 4</option>
                  <option value="5x5">5 × 5</option>
                  <option value="6x6">6 × 6</option>
                </select>
              </div>
              <button type="button" id="memory-reset">リセット</button>
            </div>

            <div class="game-stats" aria-live="polite">
              <p class="game-status" id="memory-turn-counter">試行回数: 0</p>
              <p class="game-status" id="memory-status">4x4 / 8ペア</p>
            </div>

            <div class="game-board memory-board" id="memory-board" aria-label="絵合わせ盤面"></div>
          </div>
        </section>

        <div class="return-note">
          <strong>駅を探したいとき</strong>
          <span>ゲームはいつでも途中でやめられます。駅トイレ検索へすぐ戻れます。</span>
          <a href="index.html#search-panel">駅を探す →</a>
        </div>
      </section>
    </main>

    <footer>
      <div>
        <strong>腹痛持ちのための駅トイレマップ</strong>
        <span>気を逸らす / MINI GAME</span>
      </div>
      <nav aria-label="補助メニュー">
        <a href="coping.html">腹痛時のみんなの工夫</a>
        <a href="about.html">このサイトについて</a>
        <a href="credits.html">クレジット</a>
        <a href="privacy.html">プライバシー</a>
      </nav>
    </footer>
  </div>
  <script>
    const memoryBoard = document.getElementById("memory-board");
    const memoryCard = document.querySelector(".game-card");
    const memoryStatus = document.getElementById("memory-status");
    const memoryTurnCounter = document.getElementById("memory-turn-counter");
    const memoryReset = document.getElementById("memory-reset");
    const memorySize = document.getElementById("memory-size");
    const memoryIcons = ["▲", "●", "■", "★", "◆", "❤", "✿", "☂"];
    const memoryLetters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    let memoryTiles = [];
    let memoryFlipped = [];
    let memoryMatched = 0;
    let memoryLocked = false;
    let memoryTurns = 0;
    let memoryPairCount = 8;
    let memoryBoardSize = 4;

    const getBoardSize = () => {
      const raw = memorySize?.value || "4x4";
      const parsed = Number(raw.split("x")[0]);
      return Number.isFinite(parsed) && parsed > 1 ? parsed : 4;
    };

    const getMemorySymbols = (pairCount) => {
      const pool = [...memoryIcons, ...memoryLetters];
      if (pairCount > pool.length) {
        return Array.from({ length: pairCount }, (_, i) => String(i + 1));
      }
      return pool.slice(0, pairCount);
    };

    const buildMemoryBoard = () => {
      memoryBoard.innerHTML = "";
      const existingLayer = memoryCard?.querySelector(".confetti-layer");
      if (existingLayer) {
        existingLayer.remove();
      }
      memoryTiles = [];
      memoryFlipped = [];
      memoryMatched = 0;
      memoryLocked = false;
      memoryTurns = 0;
      memoryTurnCounter.textContent = "試行回数: 0";
      memoryBoardSize = getBoardSize();
      const totalCells = memoryBoardSize * memoryBoardSize;
      const hasFreeTile = totalCells % 2 === 1;
      memoryPairCount = Math.floor(totalCells / 2);
      memoryBoard.style.gridTemplateColumns = `repeat(${memoryBoardSize}, 1fr)`;
      memoryStatus.textContent = hasFreeTile
        ? `${memoryBoardSize}x${memoryBoardSize} / ${memoryPairCount}ペア + FREE1`
        : `${memoryBoardSize}x${memoryBoardSize} / ${memoryPairCount}ペア`;

      const symbols = getMemorySymbols(memoryPairCount);
      const pairs = [...symbols, ...symbols];
      if (hasFreeTile) {
        pairs.push("FREE");
      }
      pairs.sort(() => Math.random() - 0.5);

      pairs.forEach((icon, index) => {
        const tile = document.createElement("button");
        tile.className = "tile";
        tile.type = "button";
        tile.dataset.index = String(index);
        tile.dataset.icon = icon;
        if (icon === "FREE") {
          tile.classList.add("revealed", "matched");
          tile.textContent = "FREE";
          tile.disabled = true;
        }
        tile.addEventListener("click", () => flipMemoryTile(tile));
        memoryTiles.push(tile);
        memoryBoard.appendChild(tile);
      });
    };

    const launchConfetti = () => {
      if (!memoryCard) return;
      const oldLayer = memoryCard.querySelector(".confetti-layer");
      if (oldLayer) {
        oldLayer.remove();
      }
      const layer = document.createElement("div");
      layer.className = "confetti-layer";
      const colors = ["#ff6b4a", "#f59e0b", "#10b981", "#38bdf8", "#e879f9", "#f43f5e", "#22d3ee"];
      for (let i = 0; i < 84; i += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        const side = i % 2 === 0 ? 12 : 88;
        piece.style.left = `${side + (Math.random() - 0.5) * 18}%`;
        piece.style.backgroundColor = colors[i % colors.length];
        piece.style.width = `${6 + Math.random() * 5}px`;
        piece.style.height = `${8 + Math.random() * 8}px`;
        piece.style.setProperty("--dx", `${(Math.random() - 0.5) * 260}px`);
        piece.style.setProperty("--dy", `${150 + Math.random() * 200}px`);
        piece.style.setProperty("--rot", `${300 + Math.random() * 540}deg`);
        piece.style.animationDelay = `${Math.random() * 90}ms`;
        piece.style.animationDuration = `${520 + Math.random() * 520}ms`;
        layer.appendChild(piece);
      }
      memoryCard.appendChild(layer);
      setTimeout(() => {
        layer.remove();
      }, 1200);
    };

    const flipMemoryTile = (tile) => {
      if (memoryLocked || tile.classList.contains("matched") || tile.classList.contains("revealed")) {
        return;
      }
      tile.classList.add("revealed");
      tile.textContent = tile.dataset.icon;
      memoryFlipped.push(tile);
      if (memoryFlipped.length === 2) {
        checkMemoryPair();
      }
    };

    const checkMemoryPair = () => {
      const [first, second] = memoryFlipped;
      if (!first || !second) return;
      memoryTurns += 1;
      memoryTurnCounter.textContent = `試行回数: ${memoryTurns}`;
      if (first.dataset.icon === second.dataset.icon) {
        first.classList.add("matched");
        second.classList.add("matched");
        memoryMatched += 1;
        memoryFlipped = [];
        if (memoryMatched === memoryPairCount) {
          memoryStatus.textContent = "クリア！";
          launchConfetti();
        }
        return;
      }
      memoryLocked = true;
      setTimeout(() => {
        first.classList.remove("revealed");
        second.classList.remove("revealed");
        first.textContent = "";
        second.textContent = "";
        memoryFlipped = [];
        memoryLocked = false;
      }, 700);
    };

    memoryReset.addEventListener("click", buildMemoryBoard);
    memorySize.addEventListener("change", buildMemoryBoard);
    buildMemoryBoard();
  </script>
  </div>
</body>
